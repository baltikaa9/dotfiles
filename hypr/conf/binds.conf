# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Z, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = , XF86Explorer, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod ALT, F, fullscreen,
bind = $mainMod, X, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, N, exec, AmneziaVPN
bind = CTRL SHIFT, Escape, exec, kitty --class btop btop

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u 
bind = $mainMod ALT, down, swapwindow, d

# Resize window
bind = $mainMod SHIFT, left, resizeactive, -60 0
bind = $mainMod SHIFT, right, resizeactive, 60 0
bind = $mainMod SHIFT, up, resizeactive,    0 -60
bind = $mainMod SHIFT, down, resizeactive,  0 60

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod CTRL, right, workspace, m+1
bind = $mainMod CTRL, left, workspace, m-1
bind = $mainMod CTRL, up, workspace, m-1
bind = $mainMod CTRL, down, workspace, m+1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod CTRL, S, movetoworkspacesilent, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- ГОРЯЧИЕ КЛАВИШИ ДЛЯ УПРАВЛЕНИЯ СНЕГОМ ---

# Запуск hyprsnow (Включение)
bind = $mainMod, A, exec, hyprsnow

# Остановка hyprsnow (Выключение)
bind = $mainMod SHIFT, A, exec, killall hyprsnow

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.config/bin/brightnessctl-all.sh set +10%
bindel = ,XF86MonBrightnessDown, exec, ~/.config/bin/brightnessctl-all.sh set 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Clipboard
bind = $mainMod, V, exec, kitty --class clipse clipse && wtype -M ctrl v -m ctrl

# Waybar
bind = $mainMod SHIFT, W, exec, pkill waybar; pkill cava; hyprctl dispatch exec waybar

# Other
bind = , Print, exec, GRIMBLAST_EDITOR="satty --filename" SLURP_ARGS="-w 0" grimblast edit area
bind = SHIFT, Print, exec, GRIMBLAST_EDITOR="satty --filename" SLURP_ARGS="-w 0" grimblast --freeze edit area
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, F4, exec, wlogout -b 2
bind = ALT, F4, exec, ~/.config/bin/rofi-power.sh
bind = $mainMod, F12, exec, kitty --class qalc qalc
bind = , XF86Calculator, exec, kitty --class qalc qalc
bind = $mainMod, F11, exec, hyprpicker -a
bind = $mainMod ALT, F9, exec, ~/.config/bin/wfrec-toggle.sh
bind = $mainMod, code:60, exec, rofimoji
bind = $mainMod, B, exec, $browser
bind = $mainMod, T, exec, Telegram || flatpak run org.telegram.desktop  
bind = $mainMod, Tab, exec, ~/.config/bin/window_switcher.sh